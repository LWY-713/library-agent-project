<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图书馆智能 RAG Agent</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e4e7ec;
    --text: #1f2329;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eef4ff;
    --warn: #b45309;
    --warn-soft: #fff7ed;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.65 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: min(760px, 100%); height: 100vh;
    display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12.5px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
    word-break: break-word; border: 1px solid transparent;
  }
  .user .bubble { background: var(--accent); color: #fff; border-color: var(--accent); }
  .bot .bubble { background: #f3f4f6; border-color: var(--line); }
  .bot .bubble.pending { color: var(--muted); font-style: italic; }
  .confirm {
    max-width: 82%; background: var(--warn-soft); border: 1px solid #fed7aa;
    border-radius: 12px; padding: 12px 14px;
  }
  .confirm .ask { color: var(--warn); font-weight: 600; margin-bottom: 6px; }
  .confirm code {
    display: block; font-size: 12.5px; color: #7c2d12; background: #fff;
    border: 1px dashed #fdba74; border-radius: 8px; padding: 8px 10px;
    margin-bottom: 10px; word-break: break-all; white-space: pre-wrap;
  }
  .confirm .actions { display: flex; gap: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 14px;
    border: 1px solid var(--line); background: #fff; color: var(--text);
  }
  button:hover { border-color: #c9ced6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.05); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  footer { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; }
  #q {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--text); outline: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .hint { padding: 0 20px 14px; color: var(--muted); font-size: 12.5px; }
  .hint b { font-weight: 600; color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📚 图书馆智能 RAG Agent</h1>
    <span>LangGraph · DeepSeek · Milvus Lite</span>
  </header>
  <div id="log"></div>
  <div class="hint">
    可以先试：<b>图书馆几点关门</b> · <b>帮我续借机器学习</b>（写操作会弹确认）· <b>馆长是谁</b>（应拒答）
  </div>
  <footer>
    <input id="q" placeholder="问点什么…" autocomplete="off" />
    <button class="primary" id="send">发送</button>
  </footer>
</div>
<script>
  const log = document.getElementById('log');
  const input = document.getElementById('q');
  const sendBtn = document.getElementById('send');
  const sessionId = 'web-' + Math.random().toString(36).slice(2, 10);
  let busy = false;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addUser(text) {
    const row = el('div', 'row user');
    row.appendChild(el('div', 'bubble', text));
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function addBot(text) {
    const row = el('div', 'row bot');
    row.appendChild(el('div', 'bubble', text));
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row.querySelector('.bubble');
  }

  function addConfirm(data) {
    const row = el('div', 'row bot');
    const card = el('div', 'confirm');
    card.appendChild(el('div', 'ask', data.ask || '即将执行写操作，是否确认？'));
    card.appendChild(el('code', '', data.detail || ''));
    const actions = el('div', 'actions');
    const yes = el('button', 'primary', '确认执行');
    const no = el('button', '', '取消');
    actions.append(yes, no);
    card.appendChild(actions);
    row.appendChild(card);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;

    const done = (approved) => {
      yes.disabled = no.disabled = true;
      addUser(approved ? '确认执行' : '取消');
      resolvePending(approved);
    };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
  }

  async function resolvePending(approved) {
    if (busy) return;
    busy = true;
    const bubble = addBot('处理中…');
    bubble.classList.add('pending');
    try {
      const res = await post('/api/confirm', { session_id: sessionId, approved });
      render(res, bubble);
    } catch (err) {
      bubble.classList.remove('pending');
      bubble.textContent = '请求失败：' + err.message;
    } finally {
      busy = false;
      input.focus();
    }
  }

  function render(data, bubble) {
    if (data.status === 'confirm') {
      bubble.closest('.row').remove();
      addConfirm(data);
      return;
    }
    bubble.classList.remove('pending');
    bubble.textContent = data.answer || '（没有返回内容）';
  }

  async function post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function ask() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    addUser(text);
    busy = true;
    sendBtn.disabled = true;
    const bubble = addBot('思考中…');
    bubble.classList.add('pending');
    try {
      render(await post('/api/chat', { session_id: sessionId, message: text }), bubble);
    } catch (err) {
      bubble.classList.remove('pending');
      bubble.textContent = '请求失败：' + err.message;
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.onclick = ask;
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ask(); }
  });
  input.focus();
</script>
</body>
</html>
